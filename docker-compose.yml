services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: autoshare
      POSTGRES_USER: autoshare
      POSTGRES_PASSWORD: autoshare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoshare -d autoshare"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://autoshare:autoshare@db:5432/autoshare
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: frontend
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  pgdata:
