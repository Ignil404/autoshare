services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: autoshare
      POSTGRES_USER: autoshare
      POSTGRES_PASSWORD: autoshare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoshare -d autoshare"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://autoshare:autoshare@db:5432/autoshare
      PYTHONPATH: /app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: frontend
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
