services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoshare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoshare}
      POSTGRES_DB: autoshare
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoshare"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autoshare

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://autoshare:${POSTGRES_PASSWORD:-autoshare}@db:5432/autoshare
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - autoshare

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - app
    networks:
      - autoshare

volumes:
  pgdata:

networks:
  autoshare:
