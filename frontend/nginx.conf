resolver 127.0.0.11 ipv6=off valid=30s;

server {
    listen 80;

    # ${BACKEND_URL} подставляется контейнером при старте (nginx template + envsubst).
    # Переменная в proxy_pass заставляет nginx резолвить адрес заново при каждом
    # запросе — иначе после пересоздания бэкенда nginx отдаёт 502.
    # Host не переопределяем: по умолчанию nginx шлёт Host апстрима — это нужно
    # и для Docker (app), и для Render (маршрутизация по хосту сервиса).
    set $backend "${BACKEND_URL}";

    location ^~ /api/v1/ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
