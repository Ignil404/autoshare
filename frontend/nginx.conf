# ${BACKEND_URL} и ${PORT} подставляются контейнером при старте
# (nginx template + envsubst): локально это http://app:8000 и порт80,
# на Render — адрес второго сервиса и его PORT (обычно10000).
# Адрес бэкенда подставляется литерально — nginx резолвит его при старте
# через /etc/resolv.conf, без зависимости от внутреннего DNS-резолвера.

server {
    listen ${PORT};

    location ^~ /api/v1/ws {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
